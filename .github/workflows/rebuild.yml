# Fork-only workflow: rebuild the image weekly so the base image (node:lts-slim)
# and the pip-installed yt-dlp/brotli pick up security fixes between upstream
# releases. Upstream's docker-publish.yml only runs on releases.
name: Weekly rebuild

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # --pull and no cache: the point of the rebuild is fresh layers
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
